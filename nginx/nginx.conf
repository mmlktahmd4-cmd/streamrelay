worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format streamrelay '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time uct="$upstream_connect_time"';

    access_log /var/log/nginx/access.log streamrelay;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml application/vnd.apple.mpegurl;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=stream_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream API servers (load balancing)
    upstream api_backend {
        least_conn;
        server api:3000 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend_backend {
        server frontend:80;
        keepalive 8;
    }

    # Cache for HLS segments
    proxy_cache_path /tmp/nginx_hls_cache levels=1:2 keys_zone=hls_cache:50m
                     max_size=2g inactive=60m use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}

# RTMP configuration
rtmp {
    access_log /var/log/nginx/rtmp_access.log;
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
            allow publish all;
            allow play all;

            # Push HLS on publish
            hls on;
            hls_path /var/www/hls/rtmp;
            hls_fragment 4s;
            hls_playlist_length 24s;
            hls_cleanup on;

            # Notify backend on publish/unpublish
            on_publish http://api:3000/api/rtmp/on_publish;
            on_publish_done http://api:3000/api/rtmp/on_publish_done;
        }

        application relay {
            live on;
            record off;
            allow publish 127.0.0.1;
            deny publish all;
            allow play all;

            pull rtmp://127.0.0.1:1935/live name=$name;
        }
    }
}
