server {
    listen 80;
    server_name _;

    add_header Access-Control-Allow-Origin "*" always;

    # Xtream LB style: nginx يقدّم HLS مباشرة من tmpfs/قرص بدون Node
    location ~ ^/api/hls/([^/]+)/([^/]+\.m3u8)$ {
        set $stream_key $hls_stream_key;
        access_log /var/log/nginx/hls_egress.log hls_egress if=$hls_stream_key;
        root /var/www/hls;
        try_files /$1/$2 =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        types { application/vnd.apple.mpegurl m3u8; }
    }

    location ~ ^/api/hls/([^/]+)/([^/]+\.ts)$ {
        set $stream_key $hls_stream_key;
        access_log /var/log/nginx/hls_egress.log hls_egress if=$hls_stream_key;
        root /var/www/hls;
        try_files /$1/$2 =404;
        add_header Cache-Control "max-age=5" always;
        types { video/mp2t ts; }
    }

    location /hls/ {
        set $stream_key $hls_stream_key;
        access_log /var/log/nginx/hls_egress.log hls_egress if=$hls_stream_key;
        alias /var/www/hls/;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
