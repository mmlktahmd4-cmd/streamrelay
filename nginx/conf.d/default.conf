server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Frontend Dashboard ───────────────────────────────────
    location / {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── API Backend ────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ─── VOD (أفلام) ───────────────────────────────────────────
    location /vod/ {
        limit_req zone=stream_limit burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes;
    }

    # ─── HLS Streaming with Hotlink Protection ────────────────
    location /hls/ {
        limit_req zone=stream_limit burst=20 nodelay;
        limit_conn conn_limit 5;

        # Hotlink protection — allow dashboard and empty referer
        valid_referers none blocked server_names
                       localhost
                       ~\.local$;
        if ($invalid_referer) {
            return 403;
        }

        alias /var/www/hls/;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        # CORS for players
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;

        # Disable caching for live manifests
        location ~* \.m3u8$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin "*";
        }

        # Short cache for segments
        location ~* \.ts$ {
            add_header Cache-Control "max-age=5";
            add_header Access-Control-Allow-Origin "*";
        }
    }

    # ─── MPEGTS Streaming ───────────────────────────────────────
    location /mpegts/ {
        limit_req zone=stream_limit burst=10 nodelay;

        alias /var/www/mpegts/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache";
    }

    # ─── Signed URL Validation (internal) ───────────────────────
    location ~ ^/secure/hls/(?<channel_slug>[^/]+)/ {
        # Pass to API for signature validation
        proxy_pass http://api_backend/api/stream/validate?slug=$channel_slug&expires=$arg_expires&sig=$arg_sig;
        proxy_http_version 1.1;
        internal;
    }

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

