server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;

    # ─── Frontend Dashboard ───────────────────────────────────
    location / {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── VOD Upload (ملفات كبيرة — timeout طويل + مقطّعات) ─────
    location ~ ^/api/categories/[^/]+/movies/upload {
        client_max_body_size 4096m;
        client_body_timeout 7200s;
        client_body_buffer_size 1m;
        proxy_request_buffering off;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_connect_timeout 120s;
    }

    # ─── Xtream-style: nginx يقدّم .ts مباشرة من القرص (بدون rate limit) ───
    location ~ ^/api/hls/([^/]+)/([^/]+\.ts)$ {
        set $stream_key $hls_stream_key;
        access_log /var/log/nginx/hls_egress.log hls_egress if=$hls_stream_key;
        root /var/www/hls;
        try_files /$1/$2 @hls_api;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "max-age=5" always;
        types { video/mp2t ts; }
    }

    # auth_request غير متوفر في tiangolo/nginx-rtmp — pulse يُعالَج عبر API عند الحاجة

    # ─── HLS manifest: محلي من القرص أو API للـ On Demand / relay ───
    location ~ ^/api/hls/([^/]+)/([^/]+\.m3u8)$ {
        set $stream_key $hls_stream_key;
        access_log /var/log/nginx/hls_egress.log hls_egress if=$hls_stream_key;
        root /var/www/hls;
        try_files /$1/$2 @hls_api;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        types { application/vnd.apple.mpegurl m3u8; }
    }

    location @hls_api {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    }

    # ─── باقي HLS (slug / m4s / signed) عبر API ───
    location ^~ /api/hls/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    }

    # ─── API Backend ────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=100 nodelay;
        limit_conn conn_limit 100;

        client_max_body_size 4096m;
        proxy_request_buffering off;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;
    }

    # ─── VOD (أفلام) ───────────────────────────────────────────
    location /vod/ {
        limit_req zone=stream_limit burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes;
    }

    # ─── HLS legacy path ───
    location /hls/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    # ─── MPEGTS Streaming ───────────────────────────────────────
    location /mpegts/ {
        alias /var/www/mpegts/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache";
    }

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
